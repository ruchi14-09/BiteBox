    <section class="cart">
        <h2 style="text-align: center;">Your cart</h2>

            <thead>
                <th>Item</th>

                <th>Qty</th>

                        </div>
                    </td>
                    <td>₹199</td>
                    <td>
                        <div class="qty-box">
                            <button>-</button>
                            <span>1</span>
                            <button>+</button>

                        </div>
                    </td>
                    <td>₹199</td>
                    <td><button class="remove">❌</button></td>
                </tr>
                <!--row 1-->
                <tr>
                    <td class="item">
                        <img src="image/pizza-card2.png">
                        <div>
                            <h4>Capsicum Pizza</h4>

                        </div>
                    </td>
                    <td>₹249</td>
                    <td>
                        <div class="qty-box">
                            <button>-</button>
                            <span>1</span>
                            <button>+</button>

                        </div>
                    </td>
                    <td>₹249</td>
                    <td><button class="remove">❌</button></td>
                </tr>
                <tr>
                    <td class="item">
                        <img src="image/alfredo-card4.png">

                            <p>Creamy white souce</p>
                        </div>
                    </td>
                    <td>₹229</td>
                    <td>
                        <div class="qty-box">
                            <button>-</button>
                            <span>1</span>
                            <button>+</button>

                        </div>
                    </td>
                    <td>₹229</td>
                    <td><button class="remove">❌</button></td>
                </tr>
                <tr class="grand-total">
                    <td colspan="3">Grand Total</td>
                    <td>₹797 </td>
                    <td><button>proceed</button></td>

                </tr>
            </tbody>
        </table>
